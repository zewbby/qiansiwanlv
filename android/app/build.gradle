plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPath = System.getenv('BARBERSHOP_SIGNING_PROPERTIES')
def signingFile = signingPath ? file(signingPath) : file('../../work/android-signing/signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.barbershop.app'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.barbershop.app'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '1.1.4'
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

}

